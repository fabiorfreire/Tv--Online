<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b63ce">
<title>TV Online Freire</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#17202a}
header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}.top{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border:3px solid #0b63ce;border-radius:50%;display:grid;place-items:center;color:#0b63ce;font-weight:900;font-size:23px}h1{font-size:20px;margin:0}.sub{font-size:12px;color:#6b7280;margin-top:3px}
main{max-width:1100px;margin:auto;padding:18px}.player{background:#111;border-radius:14px;overflow:hidden;box-shadow:0 5px 18px #0002}.screen{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:25px}
.screen strong{display:block;font-size:22px;margin-bottom:8px}.screen span{color:#bbb;font-size:14px}.controls{display:flex;gap:8px;padding:10px;background:#191919;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:11px 15px;background:#0b63ce;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:#17202a;border:1px solid #d8dde5}button:active{transform:scale(.98)}
h2{font-size:18px;margin:24px 0 12px}.channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.channel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:15px;cursor:pointer;box-shadow:0 2px 7px #0000000b}
.channel:hover{border-color:#0b63ce}.badge{width:42px;height:42px;border-radius:10px;background:#eef5ff;color:#0b63ce;display:grid;place-items:center;font-weight:900;margin-bottom:10px}.channel b{display:block}.channel small{color:#6b7280}.status{margin-top:14px;font-size:12px;color:#667085}
@media(max-width:600px){main{padding:12px}.top{padding:11px 12px}.screen strong{font-size:18px}}
 .screen iframe{width:100%;height:100%;border:0;background:#000;display:block}.screen video{width:100%;height:100%;object-fit:contain;background:#000;display:none}.screen{position:relative;background:radial-gradient(circle at center,#263241 0,#0b0f14 60%,#050608 100%);min-height:320px;overflow:hidden}.screen .tvmsg{display:flex}.screen iframe{display:none}.tvmsg{display:flex;flex-direction:column;align-items:center;gap:10px}.tvmsg strong{font-size:26px;text-shadow:0 2px 10px #000}.live{font-size:11px;font-weight:800;letter-spacing:.8px;background:#d62828;color:#fff;padding:5px 9px;border-radius:20px}.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:5px}.player{position:relative}.player:after{content:"TV ONLINE";position:absolute;top:10px;right:12px;color:#fff9;font-size:10px;font-weight:700;letter-spacing:1px}</style>
</head>
<body>
<header><div class="top"><div class="logo">F</div><div><h1>TV Online Freire</h1><div class="sub">Acesso às transmissões oficiais</div></div></div></header>
<main>
<section class="player">
<div class="screen" id="screen"><video id="liveVideo" controls playsinline autoplay></video><div class="tvmsg" id="placeholder"><div class="live"><i></i> AO VIVO</div><strong id="playerTitle">TV Online Freire</strong><span id="playerMsg">Selecione um canal para iniciar a transmissão.</span><button id="globoOpen" onclick="openOfficialGlobo()" style="display:none;margin-top:8px">▶ Assistir Globo ao vivo</button></div></div>
<div class="controls"><button onclick="fullscreen()">⛶ Tela cheia</button><button class="secondary" onclick="reloadPlayer()">↻ Recarregar</button><button class="secondary" onclick="stopPlayer()">■ Parar</button></div>
</section>
<div class="status" id="status">TV Online Freire • V2.2 — Globo oficial</div>
<h2>Canais</h2>
<section class="channels">
<div class="channel" onclick="openChannel('Globo')"><div class="badge">G</div><b>Globo</b><small>TV Globo • Globoplay</small></div>
<div class="channel" onclick="openChannel('Record')"><div class="badge">R</div><b>Record</b><small>RecordPlus</small></div>
<div class="channel" onclick="openChannel('Band')"><div class="badge">B</div><b>Band</b><small>Band • Ao Vivo</small></div>
<div class="channel" onclick="openChannel('SBT')"><div class="badge">S</div><b>SBT</b><small>SBT • Ao Vivo</small></div>
</section>
</main>
<script>
const channels={
Globo:'https://globoplay.globo.com/tv-globo/ao-vivo/7832875/',
Record:'https://descubra.recordplus.com/',
Band:'https://www.band.com.br/ao-vivo',
SBT:'https://www.sbt.com.br/ao-vivo'
};
let current='';
function openChannel(name){
 current=name;
 const v=document.getElementById('liveVideo'); const p=document.getElementById('placeholder'); const b=document.getElementById('globoOpen'); v.style.display='none'; p.style.display='flex'; b.style.display='none';
 document.getElementById('playerTitle').textContent=name; document.getElementById('playerMsg').textContent='';
 if(name==='Globo'){ document.getElementById('playerMsg').textContent='Transmissão oficial pelo Globoplay'; b.style.display='inline-block'; document.getElementById('status').textContent='Globo • transmissão oficial'; } else { document.getElementById('playerMsg').textContent='Canal ainda em preparação.'; document.getElementById('status').textContent='Canal ainda em preparação.'; }
}
function openOfficialGlobo(){window.location.href=channels.Globo;}
function reloadPlayer(){if(current)openChannel(current)}
function stopPlayer(){const v=document.getElementById('liveVideo');v.pause();v.removeAttribute('src');v.load();v.style.display='none';document.getElementById('globoOpen').style.display='none';document.getElementById('placeholder').style.display='flex';current='';document.getElementById('playerTitle').textContent='TV Online Freire';document.getElementById('playerMsg').textContent='Selecione um canal para iniciar a transmissão.';document.getElementById('status').textContent='Nenhum canal selecionado'}
function fullscreen(){document.querySelector('.player').requestFullscreen?.()}
</script>
</body>
</html>
