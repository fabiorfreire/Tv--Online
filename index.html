<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0757c9"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Freire TV"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon.svg"><title>Freire TV Online</title><script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.12/dist/shaka-player.compiled.min.js"></script><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:linear-gradient(135deg,#0757c9,#0a83ff);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}.wrap{max-width:1000px;margin:auto;padding:16px}h1{margin:0;font-size:27px}.sub{margin:5px 0 0;opacity:.92}.player{background:#000;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #0002;margin-bottom:14px}.player-title{background:#101828;color:#fff;padding:12px 14px;font-weight:700}.player video{width:100%;height:min(62vw,560px);min-height:260px;display:block;background:#000}.channels{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.channel{border:0;border-radius:12px;background:#fff;padding:13px 9px;text-align:left;font-weight:700;color:#172033;box-shadow:0 2px 10px #0001;cursor:pointer}.channel.active{background:#0757c9;color:#fff}.channel small{display:block;font-size:11px;font-weight:400;color:#667085;margin-top:4px}.channel.active small{color:#dbeafe}.region{font-size:13px;color:#475467;margin:0 0 12px}.status{font-size:12px;text-align:center;color:#667085;padding:8px}.notice{font-size:12px;color:#667085;margin:12px 0 0}footer{text-align:center;color:#667085;font-size:12px;padding:20px 0}</style></head><body><header><div class="wrap" style="padding:0"><h1>📺 Freire TV Online</h1><div class="sub">São Paulo • clique no canal para assistir</div></div></header><main class="wrap"><section class="player"><div class="player-title" id="title">TV Brasil — Ao vivo</div><video id="tv" controls autoplay muted playsinline></video></section><div class="status" id="status">● Transmissão carregada</div><div class="region">📍 São Paulo e Grande São Paulo</div><div class="channels" id="channels"></div><p class="notice">Transmissões provenientes de fontes oficiais das emissoras.</p><footer>TV Online</footer></main><script>
const channels=[
["TV Brasil","https://aovivo.ebc.com.br/embed-tvbrasil.html","iframe","Transmissão direta"],
["TV Cultura","https://culturaplay.tvcultura.com.br/channels/14/embed","iframe","Transmissão direta"],
["SBT SP","https://youtube-player.sbtlab.io/?videoID=R0ZJ4uevOd4&t=0&adunit=%2F1011235%2Fsbt%2Fhome%2Fao-vivo&iu=%2F1011235%2Fsbt%2Fhome%2Fao-vivo&env=vp&gdfp_req=1&output=vast&sz=1280x720&vid=R0ZJ4uevOd4&vpa=auto&vpmute=1&hl=pt&plcmt=1&vcomp=2&cust_params=conteudo%3Dao-vivo%26tema%3Dsbt-live%26tipo%3Dlive","iframe","Player oficial SBT"],
["Globo SP","https://globoplay.globo.com/tv-globo/ao-vivo/7832875/","iframe","Globoplay oficial"],
["Record SP","record","record","Player oficial Record São Paulo"],
["Band SP","https://www.band.com.br/ao-vivo","official","Transmissão oficial Band"],
["RedeTV! SP","https://geo.dailymotion.com/player/xgrus.html?video=kYe5OYErhldJ75Azib2","iframe","Player oficial RedeTV!"],
["TV Gazeta","https://geo.dailymotion.com/player/xb2fp.html?video=x9xwtpy","iframe","Player oficial TV Gazeta"],
["CazéTV","https://www.youtube.com/@CazeTV","iframe","Canal oficial CazéTV no YouTube"],
["TV Justiça","https://www.youtube.com/embed/XfwDB9udBLw?autoplay=1&mute=1","iframe","TV Justiça — transmissão oficial"],
["REDEVIDA","https://geo.dailymotion.com/player/x1mmve.html?video=xb1dec2","iframe","Player oficial REDEVIDA"],
["GE TV","https://www.youtube.com/@getv","iframe","Canal oficial GE TV"]
];
const box=document.getElementById("channels"),video=document.getElementById("tv"),title=document.getElementById("title"),status=document.getElementById("status");
let player=null;
function showIframe(url,name){video.style.display="none";let old=document.getElementById("externalFrame");if(old)old.remove();const f=document.createElement("iframe");f.id="externalFrame";f.src=url;f.title=name+" ao vivo";f.allow="autoplay; fullscreen; picture-in-picture";f.allowFullscreen=true;f.style.cssText="width:100%;height:min(62vw,560px);min-height:260px;border:0;display:block;background:#000";video.parentNode.appendChild(f);}
async function loadRecord(){try{video.style.display="block";const old=document.getElementById("externalFrame");if(old)old.remove();if(player){await player.destroy();player=null}const u="https://cdn.jmvstream.com/w/LVW-10842/LVW10842_513N26MDBL/chunklist.m3u8?webview_player=true";if(Hls.isSupported()){const h=new Hls({enableWorker:true,lowLatencyMode:false,backBufferLength:30,maxBufferLength:45,maxBufferSize:60*1000*1000,maxMaxBufferLength:90,manifestLoadingMaxRetry:6,manifestLoadingRetryDelay:1000,manifestLoadingMaxRetryTimeout:10000,levelLoadingMaxRetry:8,levelLoadingRetryDelay:1000,fragLoadingMaxRetry:8,fragLoadingRetryDelay:1000,fragLoadingMaxRetryTimeout:12000});player=h;h.on(Hls.Events.MANIFEST_PARSED,()=>{status.textContent="● Record SP — sinal estabilizado";video.play().catch(()=>{})});h.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){status.textContent="● Record SP — reconectando sinal...";try{if(d.type===Hls.ErrorTypes.NETWORK_ERROR){h.stopLoad();setTimeout(()=>h.startLoad(),1200)}else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){h.recoverMediaError()}else{h.destroy();setTimeout(()=>loadRecord(),2500)}}catch(_){setTimeout(()=>loadRecord(),3000)}}});h.loadSource(u);h.attachMedia(video)}else if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=u;video.onloadedmetadata=()=>{status.textContent="● Record SP — sinal encontrado";video.play().catch(()=>{})}}else{throw Error("Navegador sem suporte a HLS")}}catch(e){status.textContent="● Não foi possível iniciar a Record: "+e.message;console.error(e)}}
async function selectChannel(i){const [name,url,mode,desc]=channels[i];[...box.children].forEach((b,n)=>b.classList.toggle("active",n===i));title.textContent=name+" — Ao vivo";if(mode==="record"){await loadRecord();}else if(mode==="official"){window.location.href=url;return;}else{if(player){await player.destroy();player=null}showIframe(url,name);status.textContent="● "+desc}window.scrollTo({top:0,behavior:"smooth"});}
channels.forEach((c,i)=>{const b=document.createElement("button");b.className="channel"+(i===0?" active":"");b.innerHTML="▶ "+c[0]+"<small>"+c[3]+"</small>";b.onclick=()=>{if(i===3){window.location.href="https://globoplay.globo.com/tv-globo/ao-vivo/7832875/";}else{selectChannel(i);}};box.appendChild(b);});
async function sendViewerHeartbeat(){
  try{
    let id=localStorage.getItem("freire_tv_viewer_id");
    if(!id){
      id=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2));
      localStorage.setItem("freire_tv_viewer_id",id);
    }
    await fetch("/api/viewer-heartbeat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session_id:id}),
      cache:"no-store",
      keepalive:true
    });
  }catch(e){}
}
sendViewerHeartbeat();
setInterval(sendViewerHeartbeat,20000);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}
</script></body></html>
